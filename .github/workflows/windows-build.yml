name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and publish Windows x64
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Verify canonical extension source
        run: python browser-extension/build.py --check
      - name: Test browser extension behavior
        run: node tests/extension-tests.cjs
      - name: Build desktop application
        run: dotnet build src/DownloadManager.Desktop -c Release --configfile NuGet.Config
      - name: Build native browser host
        run: dotnet build src/DownloadManager.BrowserHost -c Release --configfile NuGet.Config
      - name: Test core downloads with isolated loopback fixtures
        run: dotnet run --project tests/DownloadManager.Core.Tests -c Release -- artifacts/core
      - name: Test integration and native messaging
        run: dotnet run --project tests/DownloadManager.Integration.Tests -c Release -- artifacts/integration ./src/DownloadManager.BrowserHost/bin/Release/net10.0-windows/DownloadManager.BrowserHost.exe
      - name: Test desktop layouts and settings
        run: dotnet run --project tests/DownloadManager.Desktop.Tests -c Release -- artifacts/ui
      - name: Publish self-contained Windows application
        run: |
          dotnet publish src/DownloadManager.Desktop -c Release -r win-x64 --self-contained true -o artifacts/portable --configfile NuGet.Config -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { throw 'Desktop publish failed' }
          dotnet publish src/DownloadManager.BrowserHost -c Release -r win-x64 --self-contained true -o artifacts/portable/browser-host --configfile NuGet.Config -p:PublishSingleFile=false
          if ($LASTEXITCODE -ne 0) { throw 'Native host publish failed' }
          Copy-Item LICENSE artifacts/portable/LICENSE
          Copy-Item CODE_SIGNING.md artifacts/portable/CODE_SIGNING.md
          Copy-Item media-tools/README.md artifacts/portable/media-tools/README.md
          @{ sourceCommit = $env:GITHUB_SHA; buildRun = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"; signed = $false; optionalMediaRuntimeIncluded = $false } | ConvertTo-Json | Set-Content artifacts/portable/BUILD-INFO.json
          Get-ChildItem artifacts/portable -Recurse -Filter *.pdb | Remove-Item
      - name: Upload unsigned Windows application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AAA-Download-Manager-windows-x64-unsigned
          path: artifacts/portable/
          if-no-files-found: error
          retention-days: 14
      - name: Upload isolated test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-test-results
          path: |
            artifacts/ui/*.png
            artifacts/ui/*.json
          if-no-files-found: ignore
          retention-days: 7
